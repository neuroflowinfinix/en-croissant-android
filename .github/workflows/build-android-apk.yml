name: Build En Croissant Android APK (Exact PC UI + Stockfish 19)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-apk:
    name: Build Exact En Croissant PC UI & Stockfish 19 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Official franciscoBSalgueiro/en-croissant Repository
        run: |
          if [ ! -d "src" ] || [ ! -f "vite.config.ts" ]; then
            echo "Cloning official franciscoBSalgueiro/en-croissant (74 MB)..."
            git clone --depth 1 https://github.com/franciscoBSalgueiro/en-croissant.git /tmp/ec-upstream
            rm -rf /tmp/ec-upstream/.git /tmp/ec-upstream/.github
            cp -rn /tmp/ec-upstream/* .
            cp -rn /tmp/ec-upstream/.* . 2>/dev/null || true
          fi

      - name: Configure Pre-Installed Java 17 (Required by Gradle 8.2) & pnpm@latest
        run: |
          if [ -d "/usr/lib/jvm/temurin-17-jdk-amd64" ]; then
            export JAVA_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          elif [ -d "/usr/lib/jvm/java-17-openjdk-amd64" ]; then
            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          fi
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version
          npm install -g pnpm@latest

      - name: Install En Croissant Frontend Dependencies
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete p.packageManager;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          pnpm install --no-frozen-lockfile --ignore-scripts || npm install --legacy-peer-deps --ignore-scripts
          pnpm rebuild esbuild 2>/dev/null || npm rebuild esbuild 2>/dev/null || true

      - name: Prepare Stockfish 19.0.1 Lite Single (.js) & Bundle Tauri Android Runtime
        run: |
          node scripts/prepare-capacitor-android.mjs
          mkdir -p /tmp/runtime-build
          cp scripts/tauri-android-runtime.ts /tmp/runtime-build/
          cd /tmp/runtime-build
          npm init -y
          npm install chess.js@1.0.0-beta.8 esbuild
          ./node_modules/.bin/esbuild tauri-android-runtime.ts --bundle --format=iife --platform=browser --outfile="$GITHUB_WORKSPACE/public/tauri-android-runtime.js"
          cd "$GITHUB_WORKSPACE"

      - name: Compile Untouched En Croissant PC Frontend with Vite
        run: |
          ./node_modules/.bin/vite build --config vite.android.config.ts

      - name: Package Compiled Frontend into Android Project (Isolated Capacitor Build)
        run: |
          mkdir -p /tmp/cap-apk
          cp -r dist /tmp/cap-apk/dist
          cp capacitor.config.json /tmp/cap-apk/capacitor.config.json
          cd /tmp/cap-apk
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          npx cap copy android

          ICON_SRC="$GITHUB_WORKSPACE/src-tauri/icons/icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC="$GITHUB_WORKSPACE/src-tauri/icons/128x128@2x.png"
          fi
          convert "$ICON_SRC" -define png:color-type=6 -depth 8 /tmp/ec-icon-8bit.png || cp "$ICON_SRC" /tmp/ec-icon-8bit.png

          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$dpi"
            if [ -d "$dir" ]; then
              cp /tmp/ec-icon-8bit.png "$dir/ic_launcher.png"
              cp /tmp/ec-icon-8bit.png "$dir/ic_launcher_round.png"
              cp /tmp/ec-icon-8bit.png "$dir/ic_launcher_foreground.png"
            fi
          done

          node "$GITHUB_WORKSPACE/scripts/configure-capacitor-android.mjs"

      - name: Assemble Release APK with Gradle
        run: |
          cd /tmp/cap-apk/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign & Verify Android 9+ APK
        run: |
          UNSIGNED_APK=$(find /tmp/cap-apk/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"

          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias encroissant -storepass encroissant123 -keypass encroissant123 \
            -dname "CN=neuroflowinfinix, OU=ChessCommunity, O=EnCroissant, L=Maharashtra, S=MH, C=IN"

          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -name "zipalign" | sort -V | tail -n 1)

          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" en-croissant-aligned.apk
          "$APKSIGNER" sign --ks release-key.jks --ks-key-alias encroissant \
            --ks-pass pass:encroissant123 --key-pass pass:encroissant123 \
            --out "$GITHUB_WORKSPACE/en-croissant-v0.16.1-android-arm64.apk" en-croissant-aligned.apk
          "$APKSIGNER" verify -v "$GITHUB_WORKSPACE/en-croissant-v0.16.1-android-arm64.apk"
          ls -lh "$GITHUB_WORKSPACE/en-croissant-v0.16.1-android-arm64.apk"

      - name: Upload Signed Android APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-croissant-android-apk
          path: en-croissant-v0.16.1-android-arm64.apk
          retention-days: 90

      - name: Publish Next Release (v0.16.2-mobile) Immediately Without Touching v0.16.1-android
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.16.2-mobile >/dev/null 2>&1; then
            gh release upload v0.16.2-mobile en-croissant-v0.16.1-android-arm64.apk --clobber
          else
            gh release create v0.16.2-mobile en-croissant-v0.16.1-android-arm64.apk \
              --title "En Croissant v0.16.2 Mobile (Android 9+ APK & iPadOS 15+ IPA + Stockfish 19.0.1)" \
              --notes "Built for the chess community by neuroflowinfinix (D. Ujjwal) <neuroflow_infinix@outlook.in>. Includes the Android 9.0+ (API 28+) ARM64 APK and iPadOS/iOS 15.0+ ARM64 IPA with the exact franciscoBSalgueiro/en-croissant PC interface, Stockfish 19.0.1 & Stockfish 18 single-file JS/WASM engines, White-relative Game Report evaluation & annotations, Player Overview/Ratings/Openings panels, and persistent storage."
          fi
